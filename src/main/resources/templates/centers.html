<!DOCTYPE html>
<html th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{centers.title}">Centres</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <div>
        <h1><a href="/" th:text="#{app.title}">BacSurv</a></h1>
        <p th:text="#{centers.title}">Centres d'examen</p>
    </div>
    <nav class="languages" th:aria-label="#{app.language}">
        <a href="?lang=fr" th:classappend="${lang == 'fr'} ? 'current'" th:text="#{app.language.fr}">Français</a>
        <a href="?lang=ar" th:classappend="${lang == 'ar'} ? 'current'" th:text="#{app.language.ar}">العربية</a>
    </nav>
</header>

<main>
    <div class="flash ok" th:if="${message}" th:text="${message}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>

    <section>
        <h2 th:text="#{centers.create}">Nouveau centre</h2>
        <form class="inline" method="post" action="/centers">
            <input type="text" name="name" required maxlength="120"
                   th:placeholder="#{centers.name.placeholder}">
            <button type="submit" th:text="#{centers.create.button}">Créer</button>
        </form>
    </section>

    <section>
        <h2 th:text="#{centers.title}">Centres</h2>
        <p class="muted small" th:if="${centers.isEmpty()}" th:text="#{centers.empty}">—</p>
        <div class="table-scroll" th:unless="${centers.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th th:text="#{centers.name}">Centre</th>
                    <th th:text="#{centers.teachers}">Enseignants</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${centers}">
                    <td th:text="${c.name}">Centre</td>
                    <td th:text="${c.teacherCount}">0</td>
                    <td>
                        <a class="button secondary" th:href="@{/centers/{id}(id=${c.id})}"
                           th:text="#{centers.open}">Ouvrir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <p><a class="button secondary" href="/" th:text="#{app.back}">Retour</a></p>
</main>
</body>
</html>
