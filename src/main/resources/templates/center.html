<!DOCTYPE html>
<html th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${center.name}">Centre</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <div>
        <h1><a href="/" th:text="#{app.title}">BacSurv</a></h1>
        <p th:text="${center.name}">Centre</p>
    </div>
    <div class="header-actions">
        <a class="button secondary" href="/centers" th:text="#{nav.centers}">Centres</a>
        <nav class="languages" th:aria-label="#{app.language}">
            <a href="?lang=fr" th:classappend="${lang == 'fr'} ? 'current'" th:text="#{app.language.fr}">Français</a>
            <a href="?lang=ar" th:classappend="${lang == 'ar'} ? 'current'" th:text="#{app.language.ar}">العربية</a>
        </nav>
    </div>
</header>

<main>
    <div class="flash ok" th:if="${message}" th:text="${message}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>

    <section>
        <h2 th:text="#{center.identity}">Le centre</h2>
        <form class="inline" method="post" th:action="@{/centers/{id}/rename(id=${center.id})}">
            <input type="text" name="name" th:value="${center.name}" required maxlength="120">
            <button type="submit" class="secondary" th:text="#{center.rename}">Renommer</button>
        </form>
        <p class="muted small">
            <span th:text="#{center.teachers.count(${center.teacherCount})}">0 enseignants</span>
            &nbsp;·&nbsp;
            <a th:href="@{/centers/{id}/teachers(id=${center.id})}"
               th:text="#{center.teachers.manage}">Gérer les enseignants</a>
        </p>
    </section>

    <section>
        <h2 th:text="#{rooms.title}">Les salles</h2>

        <form class="inline" method="post" th:action="@{/centers/{id}/rooms(id=${center.id})}">
            <label for="count" th:text="#{rooms.add.count}">Combien de salles ?</label>
            <input id="count" type="number" name="count" min="1" max="200" value="1" required>
            <input type="text" name="prefix" th:placeholder="#{rooms.add.prefix}" maxlength="40">
            <button type="submit" th:text="#{rooms.add.button}">Ajouter</button>
        </form>
        <p class="muted small" th:text="#{rooms.add.hint}">Les salles sont numérotées à la suite.</p>

        <p class="muted small" th:if="${center.rooms.isEmpty()}" th:text="#{rooms.empty}">—</p>
        <div class="table-scroll" th:unless="${center.rooms.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th th:text="#{rooms.label}">Salle</th>
                    <th th:text="#{rooms.surveillants}">Surveillants</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <!-- the forms live below the table; inputs join them by id, so each
                     row saves on its own without nesting a form inside a row -->
                <tr th:each="room : ${center.rooms}">
                    <td>
                        <input type="text" name="label" th:value="${room.label}" required maxlength="60"
                               th:form="'room-' + ${room.id}">
                    </td>
                    <td>
                        <input type="number" name="surveillants" min="2" max="10"
                               th:value="${room.surveillants}" th:placeholder="#{rooms.surveillants.default}"
                               th:form="'room-' + ${room.id}">
                    </td>
                    <td>
                        <button type="submit" class="secondary small"
                                th:form="'room-' + ${room.id}" th:text="#{app.save}">Enregistrer</button>
                        <button type="submit" class="secondary small"
                                th:form="'room-delete-' + ${room.id}" th:text="#{app.delete}">Supprimer</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block th:each="room : ${center.rooms}">
            <form th:id="'room-' + ${room.id}" method="post"
                  th:action="@{/centers/{id}/rooms/{roomId}(id=${center.id},roomId=${room.id})}"></form>
            <form th:id="'room-delete-' + ${room.id}" method="post"
                  th:action="@{/centers/{id}/rooms/{roomId}/delete(id=${center.id},roomId=${room.id})}"></form>
        </th:block>
    </section>

    <section>
        <h2 th:text="#{sessions.title}">Les sessions</h2>

        <form method="post" th:action="@{/centers/{id}/sessions(id=${center.id})}">
            <div class="field">
                <label for="reference" th:text="#{sessions.reference}">Nom de la session</label>
                <input id="reference" type="text" name="reference" required maxlength="80"
                       th:placeholder="#{sessions.reference.placeholder}">
            </div>
            <div class="field">
                <label for="type" th:text="#{sessions.type}">Type</label>
                <select id="type" name="type">
                    <option th:each="t : ${types}" th:value="${t}" th:text="#{'type.' + ${t}}">—</option>
                </select>
            </div>
            <div class="field">
                <label for="startsOn" th:text="#{sessions.dates}">Du … au …</label>
                <input id="startsOn" type="date" name="startsOn" required>
                <input id="endsOn" type="date" name="endsOn" required>
            </div>
            <button type="submit" th:text="#{sessions.create.button}">Créer la session</button>
        </form>

        <p class="muted small" th:if="${center.sessions.isEmpty()}" th:text="#{sessions.empty}">—</p>
        <div class="table-scroll" th:unless="${center.sessions.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th th:text="#{sessions.reference}">Session</th>
                    <th th:text="#{sessions.type}">Type</th>
                    <th th:text="#{sessions.dates}">Dates</th>
                    <th th:text="#{sessions.exams}">Épreuves</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${center.sessions}">
                    <td th:text="${s.reference}">—</td>
                    <td th:text="#{'type.' + ${s.type}}">—</td>
                    <td class="muted">
                        <span th:if="${s.startsOn != null}"
                              th:text="${#temporals.format(s.startsOn, 'dd/MM')} + ' — ' + ${#temporals.format(s.endsOn, 'dd/MM/yyyy')}">—</span>
                        <span th:if="${s.startsOn == null}">—</span>
                    </td>
                    <td th:text="${s.slotCount}">0</td>
                    <td>
                        <a class="button secondary small"
                           th:href="@{/operations/{id}/settings(id=${s.id})}"
                           th:text="#{settings.open}">Paramètres</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <p><a class="button secondary" href="/centers" th:text="#{app.back}">Retour</a></p>
</main>
</body>
</html>
