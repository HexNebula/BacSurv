<!DOCTYPE html>
<html th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{settings.title}">Paramètres</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <div>
        <h1><a href="/" th:text="#{app.title}">BacSurv</a></h1>
        <p th:text="${settings.centerName} + ' — ' + ${settings.operationReference}">—</p>
    </div>
    <nav class="languages" th:aria-label="#{app.language}">
        <a th:href="@{/operations/{id}/settings(id=${settings.operationId},lang='fr')}"
           th:classappend="${lang == 'fr'} ? 'current'" th:text="#{app.language.fr}">Français</a>
        <a th:href="@{/operations/{id}/settings(id=${settings.operationId},lang='ar')}"
           th:classappend="${lang == 'ar'} ? 'current'" th:text="#{app.language.ar}">العربية</a>
    </nav>
</header>

<main>
    <div class="flash ok" th:if="${message}" th:text="${message}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/operations/{id}/settings(id=${settings.operationId})}">
        <section>
            <h2 th:text="#{settings.staffing}">Encadrement</h2>
            <p class="field">
                <label for="surv" th:text="#{settings.surveillantsDefault}">Surveillants par salle</label>
                <input id="surv" type="number" name="defaultSurveillantsPerRoom"
                       th:min="${settings.minimumSurveillantsPerRoom}" max="10"
                       th:value="${settings.defaultSurveillantsPerRoom}" required>
                <span class="muted small"
                      th:text="#{settings.surveillantsMinimum(${settings.minimumSurveillantsPerRoom})}"></span>
            </p>
            <p class="field">
                <label for="mode" th:text="#{settings.reserveMode}">Mode de la réserve</label>
                <select id="mode" name="reserveMode">
                    <option value="PERCENTAGE" th:selected="${settings.reserveMode == 'PERCENTAGE'}"
                            th:text="#{settings.reserveMode.PERCENTAGE}">Pourcentage</option>
                    <option value="FIXED_COUNT" th:selected="${settings.reserveMode == 'FIXED_COUNT'}"
                            th:text="#{settings.reserveMode.FIXED_COUNT}">Nombre fixe</option>
                </select>
            </p>
            <p class="field">
                <label for="pct" th:text="#{settings.reservePercentage}">Pourcentage</label>
                <input id="pct" type="number" name="reservePercentage" step="0.01" min="0" max="1"
                       th:value="${settings.reservePercentage}" required>
            </p>
            <p class="field">
                <label for="fixed" th:text="#{settings.reserveFixed}">Nombre de réservistes</label>
                <input id="fixed" type="number" name="reserveFixedCount" min="0" max="99"
                       th:value="${settings.reserveFixedCount}" required>
            </p>
        </section>

        <section>
            <h2 th:text="#{settings.policy}">Politique de planification</h2>
            <p class="field">
                <label for="days" th:text="#{settings.maxConsecutive}">Jours consécutifs</label>
                <input id="days" type="number" name="maxConsecutiveDays" min="1" max="30"
                       th:value="${settings.maxConsecutiveDays}" required>
                <select name="consecutiveDaysStrength" th:aria-label="#{settings.strength}">
                    <option value="SOFT" th:selected="${settings.consecutiveDaysStrength == 'SOFT'}"
                            th:text="#{settings.strength.SOFT}">Préférence</option>
                    <option value="HARD" th:selected="${settings.consecutiveDaysStrength == 'HARD'}"
                            th:text="#{settings.strength.HARD}">Règle stricte</option>
                </select>
            </p>
            <p class="field">
                <label for="gap" th:text="#{settings.minGap}">Repos minimal</label>
                <input id="gap" type="number" name="minGapMinutes" min="0" max="240" step="5"
                       th:value="${settings.minGapMinutes}" required>
            </p>
            <p class="field">
                <label for="own" th:text="#{settings.ownSubject}">Sa propre matière</label>
                <select id="own" name="ownSubjectStrength">
                    <option value="HARD" th:selected="${settings.ownSubjectStrength == 'HARD'}"
                            th:text="#{settings.strength.HARD}">Règle stricte</option>
                    <option value="SOFT" th:selected="${settings.ownSubjectStrength == 'SOFT'}"
                            th:text="#{settings.strength.SOFT}">Préférence</option>
                </select>
            </p>
            <p class="field">
                <label>
                    <input type="checkbox" name="forbidOwnSubjectReserve" value="true"
                           th:checked="${settings.forbidOwnSubjectReserve}">
                    <span th:text="#{settings.ownSubjectReserve}">Interdire aussi la réserve</span>
                </label>
            </p>
        </section>

        <section>
            <h2 th:text="#{settings.solver}">Calcul</h2>
            <p class="field">
                <label for="secs" th:text="#{settings.solveSeconds}">Durée maximale</label>
                <input id="secs" type="number" name="solveSeconds" min="5" max="600"
                       th:value="${settings.solveSeconds}" required>
            </p>
            <p><button type="submit" th:text="#{settings.save}">Enregistrer</button></p>
        </section>
    </form>

    <section>
        <h2 th:text="#{settings.rooms}">Salles</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th th:text="#{schedule.room}">Salle</th>
                    <th th:text="#{settings.roomOverride}">Surveillants</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${settings.rooms}">
                    <td th:text="${r.label}">Salle 1</td>
                    <td>
                        <form class="inline" method="post"
                              th:action="@{/operations/{id}/settings/rooms/{room}(id=${settings.operationId},room=${r.id})}">
                            <input type="number" name="surveillants"
                                   th:min="${settings.minimumSurveillantsPerRoom}" max="10"
                                   th:value="${r.surveillants}"
                                   th:placeholder="#{settings.roomDefault}">
                            <button type="submit" th:text="#{settings.save}">Enregistrer</button>
                        </form>
                    </td>
                    <td class="muted small" th:if="${r.surveillants == null}"
                        th:text="#{settings.roomDefault} + ' (' + ${settings.defaultSurveillantsPerRoom} + ')'">—</td>
                    <td th:unless="${r.surveillants == null}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <p><a class="button secondary" href="/" th:text="#{app.back}">Retour</a></p>
</main>
</body>
</html>
