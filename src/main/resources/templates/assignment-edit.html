<!DOCTYPE html>
<html th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{change.title}">Modifier une affectation</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <div>
        <h1><a href="/" th:text="#{app.title}">BacSurv</a></h1>
        <p th:text="${duty.description}">Créneau · rôle · matière · salle</p>
    </div>
</header>

<main>
    <section>
        <h2 th:text="#{change.title}">Modifier une affectation</h2>
        <p class="small">
            <span class="muted" th:text="#{job.workload.teacher}">Enseignant</span> :
            <strong th:text="${duty.holder} ?: #{schedule.unfilled}">—</strong>
        </p>

        <form class="inline" method="post"
              th:action="@{/jobs/{id}/assignments/{duty}/review(id=${jobId},duty=${duty.dutyId})}">
            <select name="teacherId">
                <option value="" th:text="#{schedule.unfilled}">—</option>
                <option th:each="c : ${candidates}" th:value="${c.id}"
                        th:selected="${teacherId != null and teacherId == c.id}"
                        th:text="${c.name} + ' — ' + ${c.subject} + ' (' + ${c.matricule} + ')'">—</option>
            </select>
            <button type="submit" th:text="#{teachers.import.button}">Vérifier</button>
            <a class="button secondary" th:href="@{/jobs/{id}(id=${jobId})}"
               th:text="#{teachers.preview.cancel}">Annuler</a>
        </form>

        <form class="inline" method="post" style="margin-top:.8rem"
              th:action="@{/jobs/{id}/assignments/{duty}/pin(id=${jobId},duty=${duty.dutyId})}">
            <input type="hidden" name="pinned" th:value="${!duty.pinned}">
            <button type="submit" class="secondary"
                    th:text="${duty.pinned} ? #{change.unpin} : #{change.pin}">Figer</button>
            <span class="muted small" th:if="${duty.pinned}" th:text="#{change.pinned}">Figée</span>
        </form>
    </section>

    <section th:if="${review}">
        <h2 th:text="#{teachers.preview.title}">Aperçu</h2>

        <div class="flash error" th:if="${!review.legal}">
            <p th:text="#{change.illegal}">Cette modification enfreint le règlement.</p>
            <ul>
                <li th:each="b : ${review.breaches}"
                    th:text="${#messages.msgWithParams(b.code, b.args.toArray())}">—</li>
            </ul>
        </div>
        <div class="flash ok" th:if="${review.legal}"
             th:text="#{change.workload(${review.newHolder} ?: #{schedule.unfilled},
                        ${review.newHolderDutiesBefore}, ${review.newHolderDutiesAfter})}">—</div>

        <div th:if="${!review.preferenceChanges.isEmpty()}">
            <h3 class="muted small" th:text="#{change.preferences}">Préférences affectées</h3>
            <ul class="small">
                <li th:each="p : ${review.preferenceChanges}"
                    th:text="${p.key} + ' : ' + (${p.value} > 0 ? '+' : '') + ${p.value}">—</li>
            </ul>
        </div>

        <form class="inline" method="post"
              th:action="@{/jobs/{id}/assignments/{duty}(id=${jobId},duty=${duty.dutyId})}">
            <input type="hidden" name="teacherId" th:value="${teacherId}">
            <input type="hidden" name="force" th:value="${!review.legal}">
            <button type="submit"
                    th:text="${review.legal} ? #{teachers.preview.confirm} : #{change.force}">
                Confirmer
            </button>
        </form>
    </section>
</main>
</body>
</html>
