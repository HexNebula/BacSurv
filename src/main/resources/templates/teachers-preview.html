<!DOCTYPE html>
<html th:lang="${lang}" th:dir="${dir}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{teachers.preview.title}">Aperçu de l'import</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <div>
        <h1><a href="/" th:text="#{app.title}">BacSurv</a></h1>
        <p th:text="#{teachers.title(${center.name})}">Enseignants</p>
    </div>
</header>

<main>
    <section>
        <h2 th:text="#{teachers.preview.title}">Aperçu de l'import</h2>
        <p>
            <span class="badge done" th:text="#{teachers.preview.created} + ' : ' + ${preview.created.size()}">—</span>
            <span class="badge running" th:text="#{teachers.preview.updated} + ' : ' + ${preview.updated.size()}">—</span>
            <span class="badge" th:text="#{teachers.preview.unchanged} + ' : ' + ${preview.unchanged.size()}">—</span>
            <span class="badge failed" th:if="${!preview.errors.isEmpty()}"
                  th:text="#{teachers.preview.errors} + ' : ' + ${preview.errors.size()}">—</span>
        </p>

        <form method="post" th:action="@{/centers/{id}/teachers/apply(id=${center.id})}">
            <input type="hidden" name="csv" th:value="${csv}">
            <button type="submit" th:disabled="${!preview.hasChanges()}"
                    th:text="#{teachers.preview.confirm}">Confirmer</button>
            <a class="button secondary" th:href="@{/centers/{id}/teachers(id=${center.id})}"
               th:text="#{teachers.preview.cancel}">Annuler</a>
            <span class="muted small" th:if="${!preview.hasChanges()}"
                  th:text="#{teachers.preview.nothing}"></span>
        </form>
    </section>

    <section th:if="${!preview.errors.isEmpty()}">
        <h2 th:text="#{teachers.preview.errors}">Lignes ignorées</h2>
        <div class="table-scroll">
            <table>
                <tbody>
                <tr th:each="e : ${preview.errors}">
                    <td class="muted small" style="white-space:nowrap"
                        th:text="#{teachers.line(${e.line})}">Ligne 4</td>
                    <td th:text="${e.reason}">no matricule</td>
                    <td class="muted small" th:text="${e.content}">—</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section th:if="${!preview.created.isEmpty()}">
        <h2 th:text="#{teachers.preview.created}">À ajouter</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th th:text="#{job.workload.matricule}">Matricule</th>
                    <th th:text="#{job.workload.teacher}">Enseignant</th>
                    <th th:text="#{job.workload.subject}">Matière</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${preview.created}">
                    <td class="muted small" th:text="${c.matricule}">—</td>
                    <td th:text="${c.name}">—</td>
                    <td th:text="${c.subject}">—</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section th:if="${!preview.updated.isEmpty()}">
        <h2 th:text="#{teachers.preview.updated}">À mettre à jour</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th th:text="#{job.workload.matricule}">Matricule</th>
                    <th th:text="#{teachers.preview.was}">Actuellement</th>
                    <th th:text="#{teachers.preview.updated}">Après import</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${preview.updated}">
                    <td class="muted small" th:text="${c.matricule}">—</td>
                    <td class="muted" th:text="${c.was}">—</td>
                    <td th:text="${c.name} + ' · ' + ${c.subject} + ' · ' + (${c.establishment} ?: '—')">—</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
